set timeout=0
set default=0

# Real defensive fix (2026-09-14, second real hard boot failure on this
# laptop - "error: no suitable video mode found" also happened via the
# multiboot2 path, not just the original multiboot1 one): force GRUB's
# own console to plain text unconditionally, so it never attempts ANY
# graphical/gfxterm mode negotiation for its own UI, independent of
# whatever the kernel's own multiboot header does or doesn't request
# (kernel.elf's own multiboot2 header no longer requests a framebuffer
# at all either - see boot.s's own comment - this is a second,
# independent layer of the same fix).
terminal_output console

# Real UEFI-vs-BIOS switch: $grub_platform is GRUB's own standard "efi"
# or "pc" indicator - UEFI boots use the `multiboot2` command (kernel.elf
# has a real, additional .multiboot2 header); BIOS boots keep using the
# proven `multiboot` command exactly as before - old path never touched
# (user's own standing rule: new platform support must never replace an
# old working path).
menuentry "MiniC OS" {
    if [ "$grub_platform" = "efi" ]; then
        multiboot2 /boot/kernel.elf
    else
        multiboot /boot/kernel.elf
    fi
    boot
}
